name: Verify Quest
on: [push, pull_request]
jobs:
  game:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quest_test
          POSTGRES_USER: quest_test
          POSTGRES_PASSWORD: ci-test-only
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U quest_test -d quest_test" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
        env:
          QUEST_TEST_DATABASE_URL: postgresql://quest_test:ci-test-only@localhost:5432/quest_test
      - run: npm run build
  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: python3 scripts/build_clients.py --go "$(command -v go)" --linux
      - run: go test ./...
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: quest-players-windows-macos
          path: public/downloads/
