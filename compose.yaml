name: quest
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    env_file: .local/database.env
    volumes:
      - quest-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest -d quest"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  game:
    build: .
    env_file: .local/backend.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${QUEST_BIND_ADDRESS:-127.0.0.1}:${QUEST_PORT:-3004}:3000"
    restart: unless-stopped
volumes:
  quest-postgres:
